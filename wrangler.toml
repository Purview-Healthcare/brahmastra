# Deploys the API. Used by Cloudflare Workers Builds (connected to this GitHub
# repository, deploy command: npx wrangler deploy) or by hand:
#   npx wrangler secret put PEPPER
#   npx wrangler deploy
name = "brahmastra-api"
main = "worker.js"
compatibility_date = "2026-10-01"
keep_vars = true

[[d1_databases]]
binding = "DB"
database_name = "brahmastra"
database_id = "abd329d7-ed96-4541-b6c4-c4bc7b9642ae"

[vars]
BOOTSTRAP_EMAIL = "supervisor@purview-healthcare.com"
# Where the app is, for the "Open Client 360" button in the Monday digest email.
APP_URL = "https://purview-healthcare.github.io/brahmastra/"
# Admin accounts (comma-separated). Created on first run; they sign in with an email code and can load the Shastra roster.
ADMIN_EMAILS = "purviewautomate@gmail.com"
# Any email domain that contains "purview" may sign up / be added to the team.
ALLOWED_DOMAINS = "*purview*"
# Sign-in codes go out through Microsoft 365 (Graph, Mail.Send application
# permission) from the purviewautomate mailbox, using the "Brahmastra Mailer"
# registration in the purview-healthcare.com tenant.
# MS_CLIENT_SECRET is a dashboard secret, never in this file.
EMAIL_PROVIDER = "graph"
EMAIL_FROM = "Brahmastra <purviewautomate@purview-healthcare.com>"
MS_SENDER = "purviewautomate@purview-healthcare.com"
MS_TENANT_ID = "94be55e5-2194-40e4-9d98-1dcc7e91c268"
MS_CLIENT_ID = "111e229f-1aab-4b75-9282-811742bfd707"

# Every hour at :17, the roster from Purview Shastra (does nothing until the SHASTRA_FEED_KEY secret is set).
# Every 10 minutes on Monday morning (08:30 to 13:20 IST), the Monday digest, a few clients per run.
# 09:00 and 19:00 IST, Monday to Friday: the TAT reminders (Posting, Submission and Rejections at 09:00; AR at 19:00).
# Weekdays by name: Cloudflare counts 1 as Sunday, so "1" would mean Sunday, not Monday.
# The Monday schedule must stay the same as DIGEST_CRON in worker.js.
[triggers]
crons = ["17 * * * *", "*/10 3-7 * * MON", "30 3,13 * * MON-FRI"]
