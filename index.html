<script>
/* A Microsoft sign-in pop-up lands back on this page: hand its response to the window that opened it and stop there. */
(function () {
  var looks = function (s) { return /[?#&]state=/.test(s) && /[?#&](code|error)=/.test(s); };
  if (!(looks(location.search || "") || looks(location.hash || ""))) return;
  window.__BRAHMASTRA_MS_CALLBACK = true;
  var say = function (ok) {
    setTimeout(function () {
      var r = document.getElementById("root");
      if (r) r.innerHTML = '<div style="font:15px Inter,system-ui,sans-serif;padding:40px;color:#0A0E24;line-height:1.6">' + (ok ? "Microsoft sign in is complete. You can close this window and go back to Brahmastra." : "Microsoft sign in could not finish in this window. Close it and try again from Brahmastra.") + ' <a href="' + location.pathname + '">Open Brahmastra</a></div>';
    }, 800);
  };
  try { Promise.resolve(window.msalRedirectBridge.broadcastResponseToMainFrame()).then(function () { say(true); }, function () { say(false); }); } catch (e) { say(false); }
})();
</script>
<script src="lib/msal-browser.js"></script>
<script>
/* =============== BRAHMASTRA CONFIG (the only lines you need to edit) ===============
   API_BASE  Your brahmastra-api Worker URL, e.g. "https://brahmastra-api.purviewautomate.workers.dev"
             Leave it "" for demo mode: the API runs inside this browser and data stays on this device.
   ALLOWED_DOMAINS  Email domains a team lead may create accounts for. "*purview*" = any domain with purview in it.
             Exact names (purview-healthcare.com) and suffixes (*.purviewservices.com) work too.
   MS_*      The Brahmastra app registration in Microsoft Entra (public identifiers, not secrets) used for the
             OneDrive picker. MS_REDIRECT_URI must be listed on that registration as a single-page app redirect,
             and the picker only signs in when the app is opened from that address.
   ONEDRIVE_FOLDER_LINK  A sharing link to the Purview Automate inventory folder. A team lead can also set it
             from the Inventory screen; that setting wins over this one.
   THIRD_EYE_URL, DRISHTI_URL  Where Sasha's Third Eye and Drishti live. Their own tabs (Sasha's Third Eye, SLA) open them inside
             Brahmastra (team leads and above). Leave them as they are unless those apps move.
   ================================================================================== */
window.BRAHMASTRA_CONFIG = {
  API_BASE: "https://brahmastra-api.purviewautomate.workers.dev",
  ALLOWED_DOMAINS: ["*purview*"],
  MS_CLIENT_ID: "66b15331-dd65-4904-9ec1-12f60e8f837c",
  MS_TENANT_ID: "94be55e5-2194-40e4-9d98-1dcc7e91c268",
  MS_REDIRECT_URI: "https://purview-healthcare.github.io/brahmastra/",
  ONEDRIVE_FOLDER_LINK: "",
  THIRD_EYE_URL: "https://purview-healthcare.github.io/Sashas-third-eye/",
  DRISHTI_URL: "https://purview-healthcare.github.io/Drishti/",
};
</script>
<script>
/* The saved theme and text size, applied before the page draws so it never flashes the wrong colours. */
(function () { try { var p = JSON.parse(localStorage.getItem("brahmastra:prefs") || "{}") || {}, t = p.theme || "light";
  if (t === "auto") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "navy" : "light";
  if (t !== "light") document.documentElement.setAttribute("data-theme", t);
  if (p.text === "large") document.documentElement.setAttribute("data-text", "large"); } catch (e) {} })();
</script>

*{box-sizing:border-box}
html,body,#root{margin:0;padding:0;min-height:100vh;background:var(--paper)}
body{font-family:var(--font);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.input::placeholder,.textarea::placeholder{color:var(--faint)}
select option{background:var(--card);color:var(--ink)}
.display{font-family:var(--font)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:var(--tealink)}
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar-in{max-width:1360px;margin:0 auto;padding:8px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}

.nav button.active{color:var(--tealink);border-bottom-color:var(--teal);background:var(--soft)}
.nav button:not(.active):hover{color:var(--ink);background:var(--hover)}

.nav .menu{left:0;right:auto;top:40px;min-width:240px}
.nav .menu button{display:block;width:100%;text-align:left;padding:8px 10px;font-weight:500;font-size:13.5px;border:none;border-radius:6px;color:var(--ink)}

.nav .menu button:hover{background:var(--hover);color:var(--ink)}
.main{max-width:1360px;margin:0 auto;padding:22px 20px 70px}

.mt{margin-top:14px}.mb{margin-bottom:14px}.mt8{margin-top:8px}.mt16{margin-top:16px}

.btn{border:1px solid var(--line2);border-radius:8px;padding:8px 15px;font-weight:600;font-size:13.5px;cursor:pointer;background:var(--card);color:var(--ink);transition:background .12s,border-color .12s,box-shadow .12s;white-space:nowrap;font-family:inherit}

.input,.select,.textarea{width:100%;padding:8px 10px;border-radius:9px;border:1px solid var(--line2);font-size:13.5px;background:var(--input);font-family:inherit;color:var(--ink)}

.g6{display:grid;gap:12px;grid-template-columns:repeat(6,minmax(0,1fr))}@media(max-width:1100px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}}

.sug-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}.sug-grid .sug{margin-top:0}
.stepn{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--brand-strong);color:var(--on-ink);font-size:11px;font-weight:700;align-items:center;justify-content:center}
.wf-bar{position:sticky;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line,var(--line));box-shadow:0 -6px 18px rgba(10,14,36,.06);padding:10px 12px;border-radius:0 0 12px 12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}

.hist-tab span{writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.06em}.hist-tab i{font-style:normal;background:var(--card);color:var(--tealink);border-radius:9px;padding:1px 6px;font-size:11px}.hist-tab:hover{background:var(--brand-strong)}
.hist-shade{position:fixed;inset:0;z-index:71;background:rgba(10,14,36,.18)}
.hist{position:fixed;top:0;right:0;bottom:0;z-index:72;width:min(500px,100vw);background:var(--card);box-shadow:-14px 0 40px rgba(10,14,36,.18);display:flex;flex-direction:column;animation:histin .18s ease-out}
@keyframes histin{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.hist-top{padding:18px 20px 10px;border-bottom:1px solid var(--line,var(--line))}.hist-body{overflow:auto;padding:4px 20px 30px;flex:1}
.hist-day{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--slate);text-transform:uppercase;margin:16px 0 8px 40px}

.hev{position:relative;padding:0 0 14px 40px}.hev .dot{position:absolute;left:1px;top:0;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line)}

.hev .m{font-size:12px;color:var(--slate);margin-top:2px}.hev .x{font-size:12.5px;margin-top:5px;background:var(--card2);border-radius:8px;padding:6px 9px;white-space:pre-wrap}

.tabcard{text-align:left;cursor:pointer;font:inherit;color:inherit}.tabcard .tc-t{font-weight:700;font-size:15px}.tabcard:hover{border-color:var(--brand-line)}.tabcard.on{border-color:var(--teal);box-shadow:0 0 0 2px var(--soft2);background:var(--card2)}

.combo.sm .combo-ctl{padding:5px 8px;font-size:13px;border-radius:8px}
.combo-val{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.combo-val.ph{color:var(--faint);font-weight:400}
.combo-x{color:var(--faint);padding:0 2px;line-height:1}.combo-x:hover{color:var(--red-ink)}
.combo-caret{color:var(--faint);font-size:10px}
.combo-list{position:absolute;z-index:60;top:calc(100% + 4px);left:0;min-width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(10,14,36,.12);padding:4px;display:flex;flex-direction:column;max-height:320px}
.combo-q{margin:2px 2px 4px;flex-shrink:0}
.combo-opts{overflow:auto}

.t th.sort{cursor:pointer;user-select:none;white-space:nowrap}.t th.sort:hover{color:var(--ink)}

/* SLA scorecard (v2): one line per KPI with its target zone, a soft moving line around the main cards */
:root{--sc-g:#1A9E6A;--sc-a:#E8A13C;--sc-r:#D9534F;--sc-zone:#CDEBDB;--sc-glow1:#22CAE4;--sc-glow2:#2FD1B4;--sc-glow3:#30E494}

@property --sc-ang{syntax:"<angle>";inherits:false;initial-value:0deg}
.glow{position:relative;border:2px solid transparent!important;background:linear-gradient(var(--card),var(--card)) padding-box,
  conic-gradient(from var(--sc-ang),var(--line) 0deg,var(--line) 200deg,color-mix(in srgb,var(--sc-glow2) 45%,transparent) 250deg,var(--sc-glow1) 300deg,var(--sc-glow2) 325deg,var(--sc-glow3) 345deg,#fff 352deg,var(--line) 360deg) border-box!important;
  animation:sc-spin 4s linear infinite}
.glow::after{content:"";position:absolute;inset:-2px;border-radius:inherit;pointer-events:none;z-index:-1;filter:blur(8px);
  background:conic-gradient(from var(--sc-ang),transparent 0deg 270deg,color-mix(in srgb,var(--sc-glow1) 45%,transparent) 330deg,transparent 360deg);animation:sc-spin 4s linear infinite}
.sc-grid .glow:nth-child(3n+2),.sc-grid .glow:nth-child(3n+2)::after{animation-delay:-1.3s}.sc-grid .glow:nth-child(3n),.sc-grid .glow:nth-child(3n)::after{animation-delay:-2.6s}
@keyframes sc-spin{to{--sc-ang:360deg}}
@media (prefers-reduced-motion:reduce){.glow,.glow::after{animation:none}}
@media print{.glow,.glow::after{animation:none}.glow::after{display:none}}
.sc-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px}.sc-bar .field>span:first-child{display:none}

.sc-track{position:relative;flex:1;height:6px;border-radius:6px;background:var(--soft)}.sc-track .z{position:absolute;top:0;bottom:0;border-radius:6px;background:var(--sc-zone)}
.sc-track .m{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px rgba(0,0,0,.1);transform:translateX(-50%)}
.sc-legend{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--slate)}.sc-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}.sc-legend i.z{width:18px;border-radius:4px;background:var(--sc-zone)}

.crs-add{display:flex;gap:6px;margin-top:8px}.crs-add input{flex:1;border:1px dashed #b9a8f7;border-radius:8px;padding:6px 10px;font:500 12.5px Inter,sans-serif;background:#fff;color:#1d2433}.crs-add button{border:0;background:#7a5af8;color:#fff;border-radius:8px;font:700 12px Inter,sans-serif;padding:0 12px;cursor:pointer}.crs-add button:disabled{opacity:.4}

.crs-cover .cl{position:absolute;right:56px;bottom:56px;z-index:2;display:flex;align-items:center;gap:12px;color:#fff;font:700 15px Inter,sans-serif}

/* charts */
.crs-chart svg{display:block;overflow:visible}

.crc-tbl td{padding:5px 6px;border-bottom:1px solid #f0f2f6}.crc-tbl .n{text-align:right}.crc-tbl tr.total td{font-weight:700}.crc-tbl tr[data-dim]{cursor:pointer}.crc-tbl tr.dimrow td{color:#b5bdcb}
/* the studio */
.crx-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px}
.crx .seg3{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:var(--card)}
.crx .seg3 button{border:0;background:transparent;padding:7px 13px;font:600 13px var(--font);color:var(--slate);cursor:pointer}.crx .seg3 button.on{background:var(--ink);color:var(--card)}
.crx-per{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:9px;background:var(--card)}.crx-per b{padding:7px 12px;border-left:1px solid var(--line);border-right:1px solid var(--line);font-size:14px;min-width:150px;text-align:center}
.crx-per button{border:0;background:transparent;padding:7px 11px;color:var(--slate);cursor:pointer;font-size:15px}
.crx-cmp{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
.crx-fbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px}
.crx-slc-w{position:relative}.crx-slc{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:8px;padding:5px 10px;font:600 13px var(--font);background:var(--card);color:var(--ink);cursor:pointer}
.crx-slc.on{border-color:#0fa294;background:var(--teal-soft, #e8f7f4);color:#0b7d6f}.crx-slc .c{background:#0fa294;color:#fff;border-radius:999px;font:700 11px/16px var(--font);min-width:16px;text-align:center;padding:0 5px}
.crx-menu{position:absolute;z-index:30;top:36px;left:0;background:var(--card);border:1px solid var(--line2);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:8px 10px;max-height:320px;overflow:auto;min-width:240px;display:flex;flex-direction:column;gap:4px}
.crx-chip{display:inline-flex;align-items:center;gap:6px;background:#16156A;color:#fff;border-radius:999px;padding:4px 6px 4px 10px;font:600 12.5px var(--font)}.crx-chip button{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:999px;width:18px;height:18px;line-height:18px;cursor:pointer;font-size:10px;padding:0}
.crx-studio{display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px;align-items:start}
.crx-rail{padding:10px}.crx-rh{display:flex;justify-content:space-between;font:700 11.5px var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--slate);padding:4px 6px 8px}
.crx-ri{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px;font:600 13px var(--font);color:var(--ink);cursor:pointer}.crx-ri:hover{background:var(--soft)}
.crx-ri.on{background:var(--teal-soft, #e8f7f4);outline:1.5px solid #0fa294}.crx-ri.dim{color:var(--faint);cursor:default}.crx-ri .nm{flex:1;min-width:0}.crx-ri small{display:block;font:500 11px var(--font);color:var(--faint)}
.crx-ri .th{width:40px;height:23px;border-radius:5px;border:1px solid var(--line2);background:#fff;position:relative;overflow:hidden;flex:none}
.crx-ri .th:before{content:"";position:absolute;left:4px;top:4px;width:16px;height:3px;border-radius:2px;background:#16156A}
.crx-ri .th:after{content:"";position:absolute;left:4px;right:4px;bottom:4px;height:8px;border-radius:2px;background:linear-gradient(90deg,#13b9a7 0 30%,#cfe9e5 30% 55%,#13b9a7 55% 70%,#e3e8ef 70%)}
.crx-ri .ck{width:18px;height:18px;border-radius:5px;background:#0fa294;color:#fff;font:700 11px/18px var(--font);text-align:center;border:0;cursor:pointer;flex:none;padding:0}.crx-ri .ck.off{background:transparent;border:1.5px solid var(--line2)}.crx-ri .ck:disabled{cursor:default}
.crx-stage{background:var(--soft);padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.crx-wrap{border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(22,21,106,.14);background:#fff}
.crx-note{align-self:stretch;display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--slate)}
.crx-drawer .t td{font-size:12.5px}
.crx-tip{position:fixed;z-index:9999;display:none;pointer-events:none;background:#0f1424;color:#fff;border-radius:8px;padding:8px 10px;font:500 12px var(--font);box-shadow:0 8px 20px rgba(0,0,0,.25);max-width:280px}

.crx-present{position:fixed;inset:0;z-index:9000;background:#0c0f1a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.crx-pw{border-radius:6px;overflow:hidden;background:#fff}
.crx-pctl{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#dfe6ff;border-radius:999px;padding:6px 14px;font:600 13px var(--font)}
.crx-pctl b{color:#fff;font-weight:800}.crx-pctl button{border:0;background:transparent;color:#fff;font-size:16px;cursor:pointer;padding:0 4px}.crx-pctl .sep{opacity:.35}
#crPrint{position:fixed;left:-20000px;top:0}
@media print{
  body.cr-printing>*:not(#crPrint){display:none!important}
  body.cr-printing{background:#fff!important;margin:0}
  body.cr-printing #crPrint{position:static;left:0}
  body.cr-printing .crx-pp{width:1280px;height:720px;overflow:hidden;break-after:page;page-break-after:always}
  body.cr-printing .crx-pp:last-child{break-after:auto;page-break-after:auto}
